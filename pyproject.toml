[project]
name = "exist-ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "paddleocr[all]>=3.5.0",
    "paddlepaddle>=3.3.1",
    "pydantic-settings>=2.0",
    "aiofiles>=0.24.0",
    "python-magic>=0.4.27",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4", "pytest-cov>=5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
pythonpath = ["app", "."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"
