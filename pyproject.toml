[project]
name = "rune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "paddleocr[all]>=3.5.0",
    "paddlepaddle>=3.3.1",
    "pydantic-settings>=2.0",
    "aiofiles>=0.24.0",
    "python-magic>=0.4.27",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4", "pytest-cov>=5"]
dev = ["ruff>=0.11", "pre-commit>=4"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "C4", "SIM", "PT"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
pythonpath = ["app", "."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.11",
]
