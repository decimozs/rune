server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        alias /usr/share/nginx/html/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
