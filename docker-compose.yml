services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ocr:
    build: .
    ports:
      - "8000:80"
    env_file: .env
    volumes:
      - paddle_models:/home/appuser/.paddleocr 
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  paddle_models: 
