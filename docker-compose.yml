services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ocr:
    build: .
    ports:
      - "8000:80"
    env_file: .env
    environment:
      OCR_GOTENBERG_URL: http://gotenberg:3000
      OCR_DB_PATH: /app/data/ocr.db
      OCR_OUTPUT_DIR: /app/outputs
      OCR_ASSET_BASE_URL: http://localhost:8080
    volumes:
      - paddle_models:/home/appuser/.paddleocr
      - ocr_data:/app/data
      - ocr_assets:/app/outputs
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ocr_assets:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - ocr
    restart: unless-stopped

volumes:
  paddle_models:
  ocr_data:
  ocr_assets: 
